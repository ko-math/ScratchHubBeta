<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ]
      }
    };
  </script>
  <style>
    textarea{
      width: 75%;
      height: 50vh;
      display: block;
      margin: 0 auto;
    }
  </style>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
</head>
<body>
  <h1>input</h1>
  <textarea id="textarea"></textarea>
  <main class="l-main-editer js-markdown-editer" id="preview"> </main>
  <script src="https://code.jquery.com/jquery-1.9.1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/8.2.2/markdown-it.min.js"></script>
  <script>
    const textarea = document.querySelector('#textarea');
    const preview = document.querySelector('#preview');
    const markdown = window.markdownit({
    html: true,
    breaks: false
    });
    function renderMarkdown() {
      let text = textarea.value;
      //text = text.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, '');
      const mathBlocks = [];
      text = text.replace(/\\\[[\s\S]*?\\\]/g, function (match) {
        const id = mathBlocks.length;
        mathBlocks.push(match);
        return `<!--MATH_BLOCK_${id}-->`;
      });
      let html = markdown.render(text);
      html = html.replace(
        /<!--MATH_BLOCK_(\d+)-->/g,
        function (match, id) {
          return mathBlocks[id];
        }
      );
      preview.innerHTML = html;
      // MathJax
      MathJax.startup.promise.then(function () {
        MathJax.typesetClear([preview]);
        return MathJax.typesetPromise([preview]);
      });
    }
    textarea.addEventListener('input', renderMarkdown);
    renderMarkdown();
  </script>
</body>
</html>
