<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ]
      }
    };
  </script>
  <style>
    textarea{
      width: 75%;
      height: 50vh;
      display: block;
      margin: 0 auto;
    }
  </style>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
</head>
<body>
  <h1>input</h1>
  <textarea id="textarea">
  $\vartheta$
  # h1
  ## h2
  
  ### h3
  
  ダミーテキスト
  
  > 引用
  
  ## テーブル
  
  | No | Name | Data |
  |---:|:----|:----:|
  | 1 | Y | 45 |
  | 2 | A | 19 |
  
  <p style="color: red; text-align: center;">
  HTMLも可能ですわよ
  </p>
  </textarea>
  <main class="l-main-editer js-markdown-editer" id="preview"> </main>
  <script src="https://code.jquery.com/jquery-1.9.1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/8.2.2/markdown-it.min.js"></script>
  <script>
    const textarea = document.querySelector('#textarea');
    const preview = document.querySelector('#preview');
    const markdown = window.markdownit({
    html: true,
    breaks: false
    });
    function renderMarkdown() {
      const markdownText = textarea.value;
      preview.innerHTML = markdown.render(markdownText);
      if (window.MathJax) {
        MathJax.typesetClear([preview]);
        MathJax.typesetPromise([preview])
          .catch(function(error) {
            console.error('MathJax error:', error);
          });
      }
    }
    textarea.addEventListener('input', renderMarkdown);
    renderMarkdown();
  </script>
</body>
</html>
